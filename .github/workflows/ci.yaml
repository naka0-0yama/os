name: OS CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: os-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Formatting
        run: docker run --rm -v ${{ github.workspace }}:/os os-builder cargo fmt --all -- --check

      - name: Run Clippy
        run: docker run --rm -v ${{ github.workspace }}:/os os-builder cargo clippy --target x86_64-unknown-none -- -D warnings

      - name: Run Build and QEMU Test
        run: docker run --rm -v ${{ github.workspace }}:/app os-builder make run_nographic

      - name: Send Discord Notification on Success
        if: success()
        uses: discord-actions/message@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            🟢 **GitHub ActionsでのOSビルド＆テストが成功しました！**
            • **ブランチ:** `${{ github.ref_name }}`
            • **コミット:** ${{ github.event.head_commit.message }}
            • **詳細ログ:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Discord Notification on Failure
        if: failure()
        uses: discord-actions/message@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            ❌ **警告: GitHub Actionsでのビルドまたはテストが失敗しました。**
            • **ブランチ:** `${{ github.ref_name }}`
            • **コミット:** ${{ github.event.head_commit.message }}
            • **詳細ログ:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}